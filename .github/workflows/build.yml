name: Build AERIS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project zip if uploaded as zip
        run: if [ -f AERIS-project.zip ]; then unzip -oq AERIS-project.zip; fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|Could not|FAILURE' -A3 build.log | head -40 > err.txt || true
          [ -s err.txt ] || tail -30 build.log > err.txt
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' err.txt)
          echo "::error title=Gradle error::$msg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AERIS-apk-and-log
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
